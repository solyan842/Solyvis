name: Runner Provisioning Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/runner-diagnostic.yml'

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner provisioning
        run: |
          echo "runner-ok"
          uname -a
