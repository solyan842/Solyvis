name: Solyvis iOS 15 Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'MPVKit'
      - '.github/workflows/ios15-compat.yml'
  push:
    branches:
      - main
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'MPVKit'
      - '.github/workflows/ios15-compat.yml'

jobs:
  source-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Solyvis
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare iOS 15 tab availability source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('iosApp/iosApp/ContentView.swift')
          text = path.read_text()
          old = '@available(iOS 16.0, *)\nenum NuvioAppTab: String, CaseIterable, Hashable {'
          new = 'enum NuvioAppTab: String, CaseIterable, Hashable {'

          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('NuvioAppTab declaration not found; refusing broad source rewrite')
          PY
          git diff --check
          git diff -- iosApp/iosApp/ContentView.swift

      - name: Upload patched ContentView source
        uses: actions/upload-artifact@v4
        with:
          name: solyvis-ios15-patched-contentview
          path: iosApp/iosApp/ContentView.swift
          if-no-files-found: error

  ios15-compat:
    needs: source-patch
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Solyvis
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply validated ContentView patch
        uses: actions/download-artifact@v4
        with:
          name: solyvis-ios15-patched-contentview
          path: iosApp/iosApp

      - name: Verify patched tab model
        shell: bash
        run: |
          grep -q '^enum NuvioAppTab: String, CaseIterable, Hashable {' iosApp/iosApp/ContentView.swift
          if grep -B1 '^enum NuvioAppTab: String, CaseIterable, Hashable {' iosApp/iosApp/ContentView.swift | grep -q '@available(iOS 16.0, \*)'; then
            echo 'NuvioAppTab is still iOS 16-only' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version
          sw_vers

      - name: Verify MPVKit baseline
        run: |
          test -d MPVKit
          test "$(git -C MPVKit rev-parse HEAD)" = "d5cf091c80368bbbc1bbf2d195fbc55d926df888"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin iOS device framework
        env:
          GRADLE_OPTS: -Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
          KOTLIN_DAEMON_JVMARGS: -Xmx8g
        run: |
          set -o pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee ios15-gradle.log

      - name: Show first Kotlin Native errors
        if: failure()
        run: |
          if [ -f ios15-gradle.log ]; then
            echo '=== First meaningful Kotlin/Native errors ==='
            grep -nE -m 80 'error:|e: |FAILURE:|Compilation failed|linker command failed|Undefined symbols|Could not find|Exception|Caused by:' ios15-gradle.log || true
            echo '=== Last 200 Gradle log lines ==='
            tail -n 200 ios15-gradle.log || true
          fi

      - name: Upload Kotlin Native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solyvis-ios15-gradle-log
          path: ios15-gradle.log
          if-no-files-found: ignore

      - name: Inspect Xcode targets
        run: xcodebuild -project iosApp/iosApp.xcodeproj -list

      - name: Build Solyvis for iOS 15
        env:
          GRADLE_OPTS: -Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
          KOTLIN_DAEMON_JVMARGS: -Xmx8g
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee ios15-xcodebuild.log

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solyvis-ios15-xcodebuild-log
          path: ios15-xcodebuild.log
          if-no-files-found: ignore
